<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페스티벌에서 만나는 경남뮤지션</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700&family=Black+Han+Sans&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #1a4a24;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ── 배경 — 숲 느낌 그라디언트 ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 30%, rgba(232,245,51,0.12) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 15% 85%, rgba(30,107,46,0.6) 0%, transparent 60%),
        radial-gradient(ellipse 55% 55% at 85% 80%, rgba(26,75,36,0.7) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── 배경 음표 파티클 ── */
    .notes-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .note-p {
      position: absolute;
      color: rgba(232,245,51,0.12);
      font-size: 32px;
      font-weight: 900;
      animation: floatNote var(--nd, 6s) ease-in-out infinite;
      animation-delay: var(--dl, 0s);
    }
    @keyframes floatNote {
      0%, 100% { transform: translateY(0) rotate(-5deg); opacity: 0.1; }
      50%       { transform: translateY(-20px) rotate(5deg); opacity: 0.25; }
    }

    /* ── 나무 실루엣 배경 ── */
    .trees-bg {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 220px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px 20px;
      text-align: center;
    }

    /* ── 상단 태그 ── */
    .sub-title {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: rgba(232,245,51,0.85);
      letter-spacing: 6px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(232,245,51,0.3);
      border-radius: 100px;
      padding: 6px 20px;
    }

    /* ── LP 래퍼 ── */
    .lp-wrapper {
      position: relative;
      width: 300px;
      height: 300px;
    }

    /* 외부 글로우 — 옐로우 그린 */
    .lp-glow {
      position: absolute;
      inset: -24px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,245,51,0.18) 0%, rgba(157,212,74,0.08) 50%, transparent 70%);
      animation: glowPulse 3s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { transform: scale(1);    opacity: 0.6; }
      50%       { transform: scale(1.1); opacity: 1;   }
    }

    /* 사운드 웨이브 */
    .sound-waves { position: absolute; inset: -40px; border-radius: 50%; pointer-events: none; }
    .wave-ring {
      position: absolute;
      inset: 40px;
      border-radius: 50%;
      border: 1px solid rgba(232,245,51,0.25);
      animation: waveExpand var(--delay, 2s) ease-out infinite;
    }
    .wave-ring:nth-child(2) { --delay: 2.7s; }
    .wave-ring:nth-child(3) { --delay: 3.4s; }
    @keyframes waveExpand {
      0%   { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(2); opacity: 0;   }
    }

    /* LP 레코드 */
    .lp-record {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      animation: spinRecord 5s linear infinite;
      cursor: pointer;
    }
    @keyframes spinRecord {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .lp-record svg {
      width: 100%;
      height: 100%;
      filter:
        drop-shadow(0 0 16px rgba(232,245,51,0.3))
        drop-shadow(0 0 40px rgba(157,212,74,0.15));
    }

    /* 토암 */
    .tonearm {
      position: absolute;
      top: -10px;
      right: -30px;
      width: 90px;
      height: 110px;
      z-index: 10;
      transform-origin: 70px 10px;
      animation: tonearmSwing 4s ease-in-out infinite alternate;
    }
    @keyframes tonearmSwing {
      0%   { transform: rotate(-5deg); }
      100% { transform: rotate(0deg);  }
    }

    /* ── 메인 타이틀 ── */
    .main-title {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(28px, 7vw, 46px);
      font-weight: 400;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: 1px;
      text-shadow:
        0 2px 20px rgba(0,0,0,0.6),
        0 0 60px rgba(232,245,51,0.2);
    }
    .main-title .highlight {
      color: #E8F533;
      display: block;
      font-weight: 400;
      letter-spacing: 2px;
    }
    .main-title .sub-line {
      font-size: clamp(13px, 3vw, 18px);
      color: rgba(255,255,255,0.5);
      font-weight: 300;
      letter-spacing: 3px;
      margin-top: 10px;
      display: block;
      font-family: 'Noto Sans KR', sans-serif;
    }

    /* ── CTA 버튼 ── */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 44px;
      background: #1E1E1E;
      border: 1.5px solid #E8F533;
      border-radius: 60px;
      color: #E8F533;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 2px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow:
        0 0 20px rgba(232,245,51,0.2),
        0 4px 20px rgba(0,0,0,0.5);
    }
    .cta-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #E8F533;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .cta-btn:hover::before { opacity: 1; }
    .cta-btn:hover {
      color: #1E1E1E;
      transform: translateY(-3px) scale(1.03);
      box-shadow:
        0 0 40px rgba(232,245,51,0.5),
        0 8px 28px rgba(0,0,0,0.5);
    }
    .cta-btn:active { transform: translateY(-1px) scale(1.01); }
    .cta-btn span { position: relative; z-index: 1; }
    .btn-icon, .btn-arrow {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      transition: stroke 0.3s;
    }
    .cta-btn:hover .btn-icon path,
    .cta-btn:hover .btn-icon circle { stroke: #1E1E1E; }
    .cta-btn:hover .btn-arrow path  { stroke: #1E1E1E; }
    .cta-btn:hover .btn-arrow { transform: translateX(4px); }

    /* ── 뮤지시스 로고 뱃지 ── */
    .musisis-badge {
      font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #1E1E1E;
      background: #E8F533;
      border-radius: 100px;
      padding: 4px 14px;
      letter-spacing: .1em;
    }

    /* ── 하단 데코 ── */
    .footer-deco {
      font-size: 11px;
      color: rgba(232,245,51,0.35);
      letter-spacing: 4px;
    }

    @media (max-width: 480px) {
      .lp-wrapper { width: 250px; height: 250px; }
      .cta-btn { padding: 16px 32px; font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- 배경 음표 -->
  <div class="notes-bg">
    <span class="note-p" style="left:8%;  top:12%; --nd:7s;  --dl:0s">♪</span>
    <span class="note-p" style="left:88%; top:18%; --nd:5.5s; --dl:1.2s">♫</span>
    <span class="note-p" style="left:5%;  top:65%; --nd:8s;  --dl:2.1s">♩</span>
    <span class="note-p" style="left:92%; top:58%; --nd:6.5s; --dl:0.5s">♬</span>
    <span class="note-p" style="left:50%; top:8%;  --nd:9s;  --dl:3s">♭</span>
    <span class="note-p" style="left:75%; top:80%; --nd:5s;  --dl:1.7s">♮</span>
    <span class="note-p" style="left:22%; top:80%; --nd:7.5s; --dl:0.8s">♯</span>
    <span class="note-p" style="left:40%; top:88%; --nd:6s;  --dl:2.5s">♪</span>
  </div>

  <!-- 나무 실루엣 SVG -->
  <svg class="trees-bg" viewBox="0 0 800 220" preserveAspectRatio="xMidYMax meet">
    <polygon points="40,220 65,120 90,220"   fill="#0F3318"/>

    <rect x="368" y="196" width="10" height="24" fill="#0A2810"/>

    <polygon points="640,196 664,136 688,196" fill="#0F3318"/>
    <rect x="658" y="196" width="10" height="24" fill="#0A2810"/>
    <polygon points="714,220 734,150 754,220" fill="#0F3318"/>
    <polygon points="710,194 734,128 758,194" fill="#0A2810"/>
    <rect x="728" y="194" width="12" height="26" fill="#0F3318"/>
    <rect x="0"   y="212" width="800" height="8"  fill="#0A2810"/>
    <!-- 사람 실루엣 -->
    <circle cx="195" cy="160" r="8" fill="#E8F533"/>
    <path d="M187,170 Q180,190 182,210 L192,210 Q194,198 195,190 Q196,198 198,210 L208,210 Q210,190 203,170 Z" fill="#E8F533"/>
    <line x1="182" y1="182" x2="174" y2="196" stroke="#E8F533" stroke-width="4" stroke-linecap="round"/>
    <line x1="208" y1="182" x2="216" y2="172" stroke="#E8F533" stroke-width="4" stroke-linecap="round"/>
  </svg>

  <div class="container">

    <!-- 상단 태그 -->
    <p class="sub-title">2026 &nbsp;·&nbsp; <span class="musisis-badge">MUSISIS</span> &nbsp;·&nbsp; DOGO MUSIC FORESTIVAL</p>

    <!-- LP 플레이어 -->
    <div class="lp-wrapper">
      <div class="lp-glow"></div>
      <div class="sound-waves">
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
      </div>

      <!-- LP 레코드 (SVG) — 그린 컬러로 교체 -->
      <div class="lp-record">
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="recordGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#1a3020"/>
              <stop offset="30%"  stop-color="#101e14"/>

            </radialGradient>
            <radialGradient id="grooveLight" cx="40%" cy="35%" r="60%">
              <stop offset="0%"   stop-color="rgba(157,212,74,0.14)"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
            <radialGradient id="labelGrad" cx="50%" cy="40%" r="55%">
              <stop offset="0%"   stop-color="#2D8A3E"/>
              <stop offset="40%"  stop-color="#1E6B2E"/>
              <stop offset="100%" stop-color="#0F3318"/>
            </radialGradient>
            <radialGradient id="holeGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#1a3020"/>
              <stop offset="100%" stop-color="#030604"/>
            </radialGradient>
            <linearGradient id="shineGrad" x1="20%" y1="10%" x2="80%" y2="90%">
              <stop offset="0%"   stop-color="rgba(255,255,255,0.07)"/>
              <stop offset="50%"  stop-color="rgba(255,255,255,0.02)"/>
              <stop offset="100%" stop-color="transparent"/>
            </linearGradient>
          </defs>

          <!-- 레코드 베이스 -->
          <circle cx="150" cy="150" r="148" fill="url(#recordGrad)" stroke="#1a3020" stroke-width="1"/>

          <!-- 그루브 라인 -->
          <circle cx="150" cy="150" r="145" fill="none" stroke="rgba(157,212,74,0.08)" stroke-width="0.5"/>
          <circle cx="150" cy="150" r="140" fill="none" stroke="rgba(157,212,74,0.10)" stroke-width="0.5"/>
          <circle cx="150" cy="150" r="134" fill="none" stroke="rgba(157,212,74,0.08)" stroke-width="0.5"/>
          <circle cx="150" cy="150" r="128" fill="none" stroke="rgba(157,212,74,0.10)" stroke-width="0.5"/>
          <circle cx="150" cy="150" r="122" fill="none" stroke="rgba(157,212,74,0.08)" stroke-width="0.5"/>
          <circle cx="150" cy="150" r="116" fill="none" stroke="rgba(157,212,74,0.10)" stroke-width="0.5"/>
          <circle cx="150" cy="150" r="110" fill="none" stroke="rgba(157,212,74,0.08)" stroke-width="0.5"/>
          <circle cx="150" cy="150" r="104" fill="none" stroke="rgba(157,212,74,0.10)" stroke-width="0.5"/>
          <circle cx="150" cy="150" r="98"  fill="none" stroke="rgba(157,212,74,0.08)" stroke-width="0.5"/>
          <circle cx="150" cy="150" r="92"  fill="none" stroke="rgba(157,212,74,0.10)" stroke-width="0.5"/>
          <circle cx="150" cy="150" r="86"  fill="none" stroke="rgba(157,212,74,0.08)" stroke-width="0.5"/>

          <circle cx="150" cy="150" r="148" fill="url(#grooveLight)"/>

          <!-- 라벨 (그린) -->
          <circle cx="150" cy="150" r="60" fill="url(#labelGrad)"/>
          <circle cx="150" cy="150" r="60" fill="none" stroke="rgba(232,245,51,0.35)" stroke-width="1.5"/>
          <circle cx="150" cy="150" r="55" fill="none" stroke="rgba(232,245,51,0.12)" stroke-width="0.5"/>

          <!-- 라벨 텍스트 -->

          <text x="150" y="150" text-anchor="middle" fill="#ffffff" font-size="10" font-family="sans-serif" letter-spacing="1.5" font-weight="bold">MUSICIANS</text>
          <text x="150" y="163" text-anchor="middle" fill="rgba(232,245,51,0.65)" font-size="6" font-family="sans-serif" letter-spacing="1">DOGO MUSIC FORESTIVAL</text>
          <line x1="118" y1="169" x2="182" y2="169" stroke="rgba(232,245,51,0.25)" stroke-width="0.5"/>
          <text x="150" y="178" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="5.5" font-family="sans-serif" letter-spacing="1">2026 · MUSISIS</text>

          <!-- 중앙 홀 -->
          <circle cx="150" cy="150" r="6" fill="url(#holeGrad)" stroke="rgba(232,245,51,0.5)" stroke-width="0.8"/>
          <circle cx="150" cy="150" r="148" fill="url(#shineGrad)"/>
        </svg>
      </div>

      <!-- 토암 (바늘) — 그린 톤 -->
      <svg class="tonearm" viewBox="0 0 90 110" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#9DD44A"/>
            <stop offset="100%" stop-color="#4a8020"/>
          </linearGradient>
        </defs>
        <circle cx="70" cy="10" r="6" fill="#3a6018" stroke="#9DD44A" stroke-width="1"/>
        <circle cx="70" cy="10" r="3" fill="#9DD44A"/>
        <path d="M70,16 Q55,40 35,80 L30,95" stroke="url(#armGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <rect x="22" y="92" width="14" height="7" rx="2" fill="#3a6018" stroke="#9DD44A" stroke-width="0.5" transform="rotate(-10, 29, 95)"/>
        <line x1="29" y1="99" x2="28" y2="107" stroke="#E8F533" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- 메인 타이틀 -->
    <h1 class="main-title">
      <span class="highlight">페스티벌에서 만나는</span>
      경남뮤지션
      <span class="sub-line">도고뮤직포레스티발 × MUSISIS</span>
    </h1>

    <!-- CTA 버튼 -->
    <a class="cta-btn"
       href="https://www.youtube.com/playlist?list=PLG-k_d9nkrm7FxQxbEFRhQvudkYKtLC7G"
       target="_blank"
       rel="noopener noreferrer">

      </svg>
    </a>

    <p class="footer-deco">♪ &nbsp; LIVE MUSIC &nbsp; · &nbsp; FEEL THE FOREST &nbsp; ♪</p>
  </div>

  <script>
    // LP 클릭 시 속도 변화
    const lpRecord = document.querySelector('.lp-record');
    let fast = false;
    lpRecord.addEventListener('click', () => {
      fast = !fast;
      lpRecord.style.animationDuration = fast ? '1s' : '5s';
    });
  </script>

</body>
</html>
